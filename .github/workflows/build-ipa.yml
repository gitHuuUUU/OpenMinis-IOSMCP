name: Build IOS-MCP IPA

on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine version for the rootfs (default 3.21)'
        required: false
        default: '3.21'
      sdk_version:
        description: 'iOS SDK version for Theos minimal headers (default 16.5)'
        required: false
        default: '16.5'
  push:
    branches: [main]

permissions:
  contents: write

env:
  ALPINE_VERSION: ${{ github.event.inputs.alpine_version || '3.21' }}
  IOSMCP_SDK_VER: ${{ github.event.inputs.sdk_version || '16.5' }}

jobs:
  build-ipa:
    name: Build unsigned IPA (macOS runner)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26 or newer
        run: |
          XCODE_APP=$(python3 -c 'import glob,re; p=[x for x in glob.glob("/Applications/Xcode_26*.app") if "beta" not in x.lower()]; assert p, "Xcode 26 is not installed"; print(max(p,key=lambda x:tuple(map(int,re.findall(r"\d+",x)))))')
          test -n "$XCODE_APP" || { echo "No versioned Xcode installation found"; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VERSION="$(xcodebuild -version)"
          [[ "$XCODE_VERSION" =~ Xcode[[:space:]](2[6-9]|[3-9][0-9]) ]] || { echo "iOS26 SDK is required for guarded APIs"; exit 1; }

      - name: Workbench source contract checks
        run: python3 tools/test_workbench_static.py

      - name: Execute production skill disclosure regression
        run: python3 tools/test_skill_disclosure.py --require-swift

      - name: Build adapter unit tests
        run: python3 tools/test_build_workbench.py

      - name: Bundled MCP protocol and tool regression
        run: python3 tools/test_builtin_mcp.py

      - name: Photo picker and interaction source contracts
        run: |
          python3 tools/test_photo_picker_static.py
          python3 tools/test_interaction_static.py

      - name: Execute production assistant text edit regression
        run: |
          python3 tools/prepare_assistant_edit_tests.py /tmp/AssistantEditTests.swift
          swiftc -parse-as-library /tmp/AssistantEditTests.swift -o /tmp/AssistantEditTests
          /tmp/AssistantEditTests

      - name: Production WDA HTTP fixture regression
        run: python3 tools/test_wda_bridge.py

      - name: Browser interactions and production address resolver
        run: python3 tools/test_browser_interaction.py --require-swift

      - name: Swift syntax preflight
        run: find src/ios \( -path '*/MinisTests' -o -path '*/MinisUITests' \) -prune -o -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Test missing App Group storage fallback
        run: |
          xcrun swiftc src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift tools/StorageFallbackTests.swift -o /tmp/minis-storage-tests
          /tmp/minis-storage-tests

      - name: Set up Go (rclone / ish tooling)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install host dependencies
        run: |
          brew install ninja libarchive qemu lld llvm || true
          pip3 install --break-system-packages meson || pip3 install --user meson
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          which clang lld ld64.lld || true

      - name: Download Xcode Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "MetalToolchain download skipped (already present or unavailable)"

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg (links against LAME)
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH kernel + fakefsify
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs (prebuilt with IOS-MCP tooling)
        env:
          ALPINE_VER: ${{ env.ALPINE_VERSION }}
          IOSMCP_SDK_VER: ${{ env.IOSMCP_SDK_VER }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tooling comes from the prebuilt release asset; the script downloads
          # it (authenticated) inside install_tooling(). Fall back to a local
          # build only if the asset is unavailable.
          ./deps/prepare_alpine_rootfs.sh $ALPINE_VER

      - name: Build rclone (iOS)
        run: ./deps/build_rclone_ios.sh

      - name: Bundle verified iOS 15-18 SDK archives
        run: python3 tools/prepare_build_workbench.py

      - name: Build Minis app (unsigned)
        run: |
          # The repo ships only the .example config; the pbxproj references the
          # real file. Create it from the template before building.
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Minis.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Minis.app not found at $APP_PATH"
            ls -R build/DerivedData/Build/Products 2>/dev/null | head -40
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          STAGED_APP="build/Payload/Minis.app"
          # Fixed build-output path only; remove incompatible extensions before sealing.
          rm -rf "$STAGED_APP/PlugIns"
          for FW in "$STAGED_APP"/Frameworks/*.framework; do
            [ ! -d "$FW" ] || codesign --force --sign - --timestamp=none "$FW"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements src/ios/TrollStore.entitlements "$STAGED_APP"
          codesign --verify --deep --strict "$STAGED_APP"
          codesign -d --entitlements :- "$STAGED_APP" > build/trollstore-entitlements.plist
          cd build && zip -q -r ../IOS-MCP.ipa Payload && cd ..
          echo "IPA size: $(du -h IOS-MCP.ipa | cut -f1)"
          unzip -l IOS-MCP.ipa | tail -5

      - name: Validate actual iOS 15.4 binary minimums
        run: python3 tools/validate_ipa.py IOS-MCP.ipa

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT="IOS-MCP-${GITHUB_SHA:0:7}.ipa"
          cp IOS-MCP.ipa "$OUTPUT"
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"
          SYMBOLS="IOS-MCP-${GITHUB_SHA:0:7}-symbols.zip"
          DSYM="build/DerivedData/Build/Products/Release-iphoneos/Minis.app.dSYM"
          test -d "$DSYM"
          ditto -c -k --keepParent "$DSYM" "$SYMBOLS"
          gh release upload rootfs-tooling-v1 "$OUTPUT" "$OUTPUT.sha256" "$SYMBOLS" --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $OUTPUT"
